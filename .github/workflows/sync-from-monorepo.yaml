name: Sync from monorepo

# Publishes the Slint plugin from the slint-ui/slint monorepo into this repo.
# The monorepo is the single source of truth; this repo is a generated mirror.
#
# - `master` holds released content, synced from `release/1`. Its preview
#   runs the WebAssembly interpreter of the same release.
# - `nightly` holds the monorepo's `master`. Its preview runs the snapshot
#   interpreter, and its version gets a `-nightly.<UTC timestamp>` suffix so
#   that clients see each change as an update.
#
# The manual trigger syncs both branches. Its `ref` input publishes another
# monorepo branch or tag to `master`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Monorepo ref to publish to master (branch or tag)"
        required: false
        default: "release/1"
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            source: ${{ inputs.ref || 'release/1' }}
            channel: release
          - branch: nightly
            source: master
            channel: snapshot
    concurrency:
      group: sync-from-monorepo-${{ matrix.branch }}
      cancel-in-progress: true
    env:
      BRANCH: ${{ matrix.branch }}
      SOURCE: ${{ matrix.source }}
      CHANNEL: ${{ matrix.channel }}
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Switch to the target branch
        run: |
          set -euo pipefail
          if git fetch --depth 1 origin "$BRANCH"; then
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            # The first sync creates the branch from master. Workflows only
            # run from the default branch, so it doesn't need a copy.
            git checkout -b "$BRANCH"
            git rm -rq .github
          fi

      - name: Fetch the plugin from the monorepo
        run: |
          set -euo pipefail
          # Clone outside the workspace so the checkout never lands in the
          # published tree (and is not seen by the rsync --delete below).
          git clone --depth 1 --filter=blob:none --sparse --branch "$SOURCE" \
            https://github.com/slint-ui/slint.git "$RUNNER_TEMP/monorepo"
          # The plugin's icons are symlinks into logo/.
          git -C "$RUNNER_TEMP/monorepo" sparse-checkout set ai-plugins logo
          echo "SLINT_SHA=$(git -C "$RUNNER_TEMP/monorepo" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Sync the plugin
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/monorepo/ai-plugins" ]; then
            echo "Ref has no ai-plugins/ directory yet — nothing to publish."
            exit 0
          fi
          # The monorepo's ai-plugins/ directory is the single source of truth.
          # Mirror it onto this repo's root; README and .github are owned here
          # and are preserved. Symlinks out of ai-plugins/ become copies.
          rsync -a --copy-unsafe-links --delete \
            --exclude='.git' --exclude='.github' --exclude='README.md' \
            "$RUNNER_TEMP/monorepo/ai-plugins/" ./
          if [ -d mcp/slint-preview ]; then
            printf '{ "channel": "%s" }\n' "$CHANNEL" > mcp/slint-preview/channel.json
          fi

      - name: Add the nightly version suffix
        if: matrix.branch == 'nightly'
        run: |
          set -euo pipefail
          manifests=$(find . -path ./.git -prune -o \
            \( -name plugin.json -o -name marketplace.json \) -print)
          set_version() {
            echo "$manifests" | xargs sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$1\"/"
          }
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' .claude-plugin/plugin.json)
          previous=$(git show HEAD:.claude-plugin/plugin.json 2>/dev/null \
            | sed -n 's/.*"version": "[^"]*-nightly\.\([0-9]*\)".*/\1/p' || true)
          # Reuse the previous timestamp first, so that only a change in
          # content or in the monorepo's version publishes a new nightly.
          if [ -n "$previous" ]; then
            set_version "$version-nightly.$previous"
            git add -A
            git diff --cached --quiet && exit 0
          fi
          set_version "$version-nightly.$(date -u +%Y%m%d%H%M)"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "slint-sync-bot"
          git config user.email "noreply@slint.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "Sync from slint-ui/slint@${SLINT_SHA}"
            git push origin "HEAD:$BRANCH"
          fi
