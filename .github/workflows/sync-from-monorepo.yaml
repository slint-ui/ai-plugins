name: Sync from monorepo

# Publishes the Slint plugin from the slint-ui/slint monorepo into this repo.
# The monorepo is the single source of truth; this repo is a generated mirror.
#
# By default it pulls from `release/1` (the latest stable release branch), so
# this repo's default branch always holds released content, and its preview
# runs the WebAssembly interpreter of that release. Use the manual trigger with
# a different `ref` to publish from another branch or a tag.
#
# slint-ui/ai-plugins-nightly publishes the plugin from master the same way.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Monorepo ref to publish (branch or tag)"
        required: false
        default: "release/1"
  schedule:
    # Daily. Skills only change on releases, so a small lag is fine.
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: sync-from-monorepo
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Fetch the plugin from the monorepo
        id: monorepo
        env:
          REF: ${{ github.event.inputs.ref || 'release/1' }}
        run: |
          set -euo pipefail
          # Clone outside the workspace so the checkout never lands in the
          # published tree (and is not seen by the rsync --delete below).
          git clone --depth 1 --filter=blob:none --sparse --branch "$REF" \
            https://github.com/slint-ui/slint.git "$RUNNER_TEMP/monorepo"
          git -C "$RUNNER_TEMP/monorepo" sparse-checkout set ai-plugins
          echo "SLINT_SHA=$(git -C "$RUNNER_TEMP/monorepo" rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ ! -d "$RUNNER_TEMP/monorepo/ai-plugins" ]; then
            exit 0
          fi
          # Check out the directories that the plugin's symlinks point into,
          # such as logo/, so that rsync can copy their targets.
          targets=$(cd "$RUNNER_TEMP/monorepo" \
            && find ai-plugins -type l -exec realpath -m --relative-to=. {} \; \
            | xargs -r -n1 dirname | sort -u)
          git -C "$RUNNER_TEMP/monorepo" sparse-checkout add $targets
          if [ -f "$RUNNER_TEMP/monorepo/ai-plugins/mcp/slint-preview/build-checker.mjs" ]; then
            echo "build_checker=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for the checker
        if: steps.monorepo.outputs.build_checker == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build the preview checker
        if: steps.monorepo.outputs.build_checker == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/monorepo"
          # The checker build needs the full Rust workspace.
          git sparse-checkout disable
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://wasm-bindgen.github.io/wasm-pack/installer/init.sh | sh
          npm --prefix ai-plugins/mcp/slint-preview run build:checker -- --release
          checker_directory=ai-plugins/mcp/slint-preview/checker
          test -s "$checker_directory/slint_wasm_interpreter.js"
          test -s "$checker_directory/slint_wasm_interpreter_bg.wasm"
          test -s "$checker_directory/package.json"
          # wasm-pack ignores the entire output directory, which the mirror commits.
          rm -f "$checker_directory/.gitignore"

      - name: Sync the plugin
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/monorepo/ai-plugins" ]; then
            echo "Ref has no ai-plugins/ directory yet — nothing to publish."
            exit 0
          fi
          # The monorepo's ai-plugins/ directory is the single source of truth.
          # Mirror it onto this repo's root; README and .github are owned here
          # and are preserved. Symlinks out of ai-plugins/ become copies.
          rsync -a --copy-unsafe-links --delete \
            --exclude='.git' --exclude='.github' --exclude='README.md' \
            "$RUNNER_TEMP/monorepo/ai-plugins/" ./
          if [ -d mcp/slint-preview ]; then
            printf '{ "channel": "release" }\n' > mcp/slint-preview/channel.json
          fi

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "slint-sync-bot"
          git config user.email "noreply@slint.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "Sync from slint-ui/slint@${SLINT_SHA}"
            git push
          fi
